# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

#test

# trigger:
#   branches:
#     include:
#       - dev

parameters:
  - name: Env
    type: string
    default: 'dev'
    values:
      - dev
      - uat
      - prod

variables:
  - group: advwrks22-vg-kv  # variable group reference
  - name: resourceGroup     # individual variables
    value: 'adventureworks-22-proj-rg'
  - name: dataFactory
    value: 'adventureworks-22-proj-adf'
  - name: packagePath
    value: '/build/'
  - name: adfRootPath
    value: ''
  - name: parameterFileName
    value: 'adf-parameters.${{ parameters.Env }}.json'
  

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build_And_Publish_Adf_Artifacts
    displayName: 'Build and Publish ADF Artifacts'
    jobs:
      - job: Build_Adf_Arm_Template
        displayName: 'Build ADF Arm Template'
        steps:
          # - script: |
          #     echo "deb : $(packagePath) > $(adfRootPath) ~ $(advwrks22-adf-sbscr-id) >> $(resourceGroup) >> $(dataFactory) >> $(Build.Repository.LocalPath)"
          #   displayName: 'debug'
          - template : templates/setup-node-npm.yml
            parameters:
              packagePath: '$(packagePath)'
          - template : templates/npm-custom.yml
            parameters:
              customCommand: 'run build validate $(Build.Repository.LocalPath)$(adfRootPath) /subscriptions/$(advwrks22-adf-sbscr-id)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactory)'
              displayName: 'Run ADF Validation'
              packagePath: '$(packagePath)'
          - template : templates/npm-custom.yml
            parameters:
              customCommand: 'run build export $(Build.Repository.LocalPath)$(adfRootPath) /subscriptions/$(advwrks22-adf-sbscr-id)/resourceGroups/$(resourceGroup)/providers/Microsoft.DataFactory/factories/$(dataFactory) ArmTemplate'
              displayName: 'Run ADF Export'
              packagePath: '$(packagePath)'
          - script: |
              echo "Current Build ID: " $(Build.BuildId) " and Build Number: " $(Build.BuildNumber)
            displayName: 'Display Build ID'
          - script: |
              echo "SourceFolder: $(Build.Repository.LocalPath)/$(parameterFileName)"
            displayName: 'Sources Path'
          - script: |
              ls -R $(Pipeline.Workspace)
            displayName: 'debug'
          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(Build.Repository.LocalPath)/$(parameterFileName)'
              targetFolder: '$(Build.Repository.LocalPath)$(packagePath)/ArmTemplate'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.Repository.LocalPath)$(packagePath)/ArmTemplate'
              artifact: 'ArmTemplate'
            displayName: 'Publish ADF Arm Template Artifact'