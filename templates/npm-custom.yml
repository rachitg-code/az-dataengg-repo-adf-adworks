parameters:
  - name: 'customCommand'
  - name: 'displayName'


steps:
  - script: |
      echo "deb3 : ${{parameters.customCommand}}"
    displayName: 'debug3'
  - task: Npm@1
    inputs:
      command: 'custom'
      customCommand: ${{parameters.customCommand}}
    displayName: ${{parameters.displayName}}
