parameters:
  - name: packagePath
  
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'
  - script: |
      echo "deb2 : $(Build.Repository.LocalPath)${{ parameters.packagePath }}"
    displayName: 'debug2'
  - task: Npm@1
    inputs:
      command: 'install'
      workingDir: '$(Build.Repository.LocalPath)${{ parameters.packagePath }}'
    displayName: 'Install NPM Packages'