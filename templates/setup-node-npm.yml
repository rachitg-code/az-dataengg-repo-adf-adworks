parameters:
  - name: packagePath
  
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'
  - task: Npm@1
    inputs:
      command: 'install'
      displayName: 'Install NPM Packages'
      workingDir: '$(Build.Repository.LocalPath)${{ parameters.packagePath }}'